[project]
name = "conversationforwarder"
version = "0.1.0"
description = "Home Assistant custom component that forwards conversations to an HTTP endpoint."
requires-python = ">=3.13.2,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2025.12.5",
    "hassil==3.5.0",
    "home-assistant-intents==2025.12.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7.6",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
